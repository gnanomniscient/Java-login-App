name: Spring Boot CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Check Versions
        run: |
          java -version
          mvn -version

      - name: Build WAR
        run: mvn clean package

      - name: Show Target Directory
        run: ls -la target

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dptweb-war
          path: target/*.war
